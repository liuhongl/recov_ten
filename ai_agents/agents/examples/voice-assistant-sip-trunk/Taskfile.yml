version: "3"

dotenv: ["../../../.env"]

tasks:
  install-tenapp:
    desc: install tenapp dependencies
    internal: true
    dir: ./tenapp
    cmds:
      - tman install

  install-tenapp-python-deps:
    desc: install tenapp python dependencies
    deps: [install-tenapp]
    internal: true
    dir: ./tenapp
    cmds:
      - bash ./scripts/install_python_deps.sh

  install-server-deps:
    desc: install stage 2 Media Hub server dependencies
    internal: true
    dir: ./server
    cmds:
      - uv pip install --system -r requirements.txt

  build-api-server:
    desc: build api server
    dir: ../../../server
    cmds:
      - go mod tidy && go mod download && go build -o bin/api main.go

  install:
    desc: install dependencies
    cmds:
      - task: install-tenapp
      - task: install-tenapp-python-deps
      - task: install-server-deps
      - task: build-api-server

  run-media-hub:
    desc: run minimal Media Hub for stage 2 validation
    dir: .
    cmds:
      - python3 server/main.py --host 0.0.0.0 --port 9000

  test-media-hub-fake-audio:
    desc: run fake FS/TEN PCM roundtrip test through Media Hub
    dir: .
    cmds:
      - python3 server/fake_audio_clients.py --channel call_fake_audio_001

  test-bridge-audio-frame-roundtrip:
    desc: run fake FS PCM roundtrip through TEN sip_media_bridge AudioFrame echo graph
    dir: .
    cmds:
      - python3 server/fake_fs_audio_client.py --channel call_stage4_audio_frame_001

  run-api-server:
    desc: run TEN api server for this example
    dir: ../../../server
    cmds:
      - ./bin/api -tenapp_dir={{.PWD}}/tenapp

  run:
    desc: run the TEN api server
    deps:
      - task: run-api-server

  release:
    desc: release
    cmds:
      - ../../scripts/release.sh {{.PWD}}/tenapp
