[server]
host = "127.0.0.1"
port = 9100

[logging]
level = "INFO"

[freeswitch]
media_host = "0.0.0.0"
media_port = 9101
sample_rate = 8000
phone_codec = "PCMA"
echo_mode = "raw"

[realtime]
provider = "aliyun"
url = "wss://dashscope.aliyuncs.com/api-ws/v1/realtime"
model = "qwen3.5-omni-plus-realtime"
voice = "Ethan"

[vad]
speech_rms_threshold = 300
start_speech_ms = 60
end_silence_ms = 500
min_speech_ms = 240
max_utterance_ms = 12000
pre_speech_ms = 160
keep_silence_ms = 160
barge_in_enabled = false

[features]
metrics_enabled = true
recording_enabled = false
